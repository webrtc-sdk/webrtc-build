name: build

on:
  workflow_dispatch:
    inputs:
      commitHash:
        description: 'webrtc-sdk/webrtc commit hash (default: WEBRTC_COMMIT in VERSION)'
        default: ''
        required: false
      configuration:
        description: 'build configuration'
        default: 'release'
        required: true
        type: choice
        options:
          - release
          - debug
      libwebrtcRef:
        description: 'webrtc-sdk/libwebrtc ref for the libwebrtc builds'
        default: 'main'
        required: false
      force_cache_update:
        description: 'Rebuild the source caches from scratch'
        type: boolean
        default: false
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.dockerignore'
    branches-ignore:
      - daily
    tags:
      - '*'

permissions:
  packages: write
  contents: write
  actions: read

env:
  CONFIG_ARGS: ${{ github.event.inputs.configuration == 'debug' && '--debug' || '' }}

# The Linux source cache (.github/actions/source-cache, Namespace volume) is
# shared by the android and libwebrtc_linux jobs and the sync and unittests
# workflows. It is updated only when the webrtc commit changes or
# force_cache_update is checked. Jobs sharing it sync the same target_os
# (--sync-for). GitHub-hosted macOS/Windows jobs sync from scratch.

jobs:
  # One webrtc checkout per job; targets in a job share it. Apple is split in
  # two jobs to stay well under the 6h limit of GitHub-hosted runners.
  build-apple:
    name: build (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: apple
            targets: apple
          - id: apple-prefixed
            targets: apple_prefixed apple_prefixed_stripped
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v5
    - name: Select Xcode 26.0
      run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
    - name: Source cache
      id: cache
      uses: ./.github/actions/source-cache
      with:
        backend: none
        commit: ${{ github.event.inputs.commitHash }}
    - name: Build
      run: |
        python3 scripts/build.py build ${{ matrix.targets }} --sync-for apple \
          --commit '${{ steps.cache.outputs.commit }}' ${{ steps.cache.outputs.fresh-arg }} $CONFIG_ARGS
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.id }}
        path: _package/*
        compression-level: 0

  build-android:
    name: build (android)
    runs-on: namespace-profile-webrtc-android
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo ./scripts/apt_install_x86_64.sh
    - name: Source cache
      id: cache
      uses: ./.github/actions/source-cache
      with:
        backend: namespace
        id: linux
        commit: ${{ github.event.inputs.commitHash }}
        force: ${{ github.event.inputs.force_cache_update || 'false' }}
    - name: Build
      run: |
        python3 scripts/build.py build android android_prefixed android_prefixed_stripped \
          --sync-for libwebrtc_linux_x64 \
          --commit '${{ steps.cache.outputs.commit }}' ${{ steps.cache.outputs.fresh-arg }} $CONFIG_ARGS
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-android
        path: _package/*
        compression-level: 0

  build-libwebrtc-linux:
    name: build (libwebrtc_linux_${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # Same runner profile as android: shares its source cache volume.
    runs-on: namespace-profile-webrtc-android
    steps:
    - uses: actions/checkout@v5
    - uses: actions/checkout@v5
      with:
        repository: webrtc-sdk/libwebrtc
        ref: ${{ github.event.inputs.libwebrtcRef || 'main' }}
        path: libwebrtc
    - name: Install dependencies
      run: |
        sudo ./scripts/apt_install_x86_64.sh
        sudo apt-get install -y openjdk-11-jdk
    - name: Source cache
      id: cache
      uses: ./.github/actions/source-cache
      with:
        backend: namespace
        id: linux
        commit: ${{ github.event.inputs.commitHash }}
        force: ${{ github.event.inputs.force_cache_update || 'false' }}
    - name: Build
      run: |
        python3 scripts/build.py build libwebrtc_linux_${{ matrix.arch }} --libwebrtc-dir libwebrtc \
          --sync-for android libwebrtc_linux_x64 \
          --commit '${{ steps.cache.outputs.commit }}' ${{ steps.cache.outputs.fresh-arg }} $CONFIG_ARGS
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-libwebrtc-linux-${{ matrix.arch }}
        path: _package/*
        compression-level: 0

  build-libwebrtc-windows:
    name: build (libwebrtc_win_${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v5
    - uses: actions/checkout@v5
      with:
        repository: webrtc-sdk/libwebrtc
        ref: ${{ github.event.inputs.libwebrtcRef || 'main' }}
        path: libwebrtc
    - name: Source cache
      id: cache
      uses: ./.github/actions/source-cache
      with:
        backend: none
        commit: ${{ github.event.inputs.commitHash }}
    - name: Build
      # The D:\ work drive is too small for a webrtc checkout; use C:\.
      shell: pwsh
      env:
        COMMIT: ${{ steps.cache.outputs.commit }}
        FRESH: ${{ steps.cache.outputs.fresh-arg }}
        CONFIGURATION: ${{ github.event.inputs.configuration }}
      run: |
        $extra = @('--commit', $env:COMMIT)
        if ($env:FRESH) { $extra += $env:FRESH }
        if ($env:CONFIGURATION -eq 'debug') { $extra += '--debug' }
        python3 scripts/build.py build libwebrtc_win_${{ matrix.arch }} `
          --libwebrtc-dir libwebrtc --work-dir 'C:\wb' --sync-for libwebrtc_win_x64 @extra
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-libwebrtc-win-${{ matrix.arch }}
        path: C:\wb\_package\*
        compression-level: 0

  create-release:
    name: Create Release
    if: github.ref_type == 'tag'
    needs:
      - build-apple
      - build-android
      - build-libwebrtc-linux
      - build-libwebrtc-windows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: packages-*
        merge-multiple: true
    - name: Aggregate checksums
      working-directory: artifacts
      run: |
        cat *.sha256 > SHA256SUMS.txt
        cat *.md5 > MD5SUMS.txt
        ls -l
    - uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: artifacts/*

  publish-xcframework:
    name: Publish
    if: github.ref_type == 'tag'
    needs:
      - create-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        name: packages-apple-prefixed
    - name: Render Package.swift and podspec
      id: render
      run: |
        # Build tags are prefixed with m (m144.7559.13); hosting repo tags are not.
        VERSION="${GITHUB_REF_NAME#m}"
        CHECKSUM=$(sha256sum artifacts/LiveKitWebRTC.xcframework.zip | awk '{print $1}')
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        mkdir -p out
        for f in Package.swift LiveKitWebRTC.podspec; do
          sed -e "s|{{VERSION}}|${VERSION}|g" \
              -e "s|{{CHECKSUM}}|${CHECKSUM}|g" \
              ".github/templates/$f" > "out/$f"
        done
    - uses: livekit/publish-xcframework-action@3b8645334fb62b0fd1d7067067819bcd111db157 # main
      with:
        xcframework-zip: artifacts/LiveKitWebRTC.xcframework.zip
        version: ${{ steps.render.outputs.version }}
        hosting-repo: livekit/webrtc-xcframework
        files: |
          out/Package.swift:Package.swift
          out/LiveKitWebRTC.podspec:LiveKitWebRTC.podspec
        token: ${{ secrets.XCFRAMEWORK_PAT }}
