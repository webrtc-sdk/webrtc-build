name: build

# Builds every release package. Runs on release PRs (release-pr.yml), by hand,
# and from release.yml when a merged release PR has no successful build to reuse.
# Publishing lives in release.yml.

on:
  workflow_dispatch:
    inputs:
      commitHash:
        description: 'webrtc commit hash (default: WEBRTC_COMMIT in VERSION)'
        default: ''
        required: false
      configuration:
        description: 'build configuration'
        default: 'release'
        required: true
        type: choice
        options:
          - release
          - debug
      libwebrtcRef:
        description: 'webrtc-sdk/libwebrtc ref for the libwebrtc builds'
        default: 'main'
        required: false
      force_cache_update:
        description: 'Rebuild the Linux source cache from scratch'
        type: boolean
        default: false
      dry_run:
        description: 'Upload placeholder packages instead of building (tests the release flow)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      commitHash:
        type: string
        default: ''
      configuration:
        type: string
        default: 'release'
      libwebrtcRef:
        type: string
        default: 'main'
      force_cache_update:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/actions/**'

concurrency:
  # A newer push to a release PR supersedes the running build.
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONFIG_ARGS: ${{ inputs.configuration == 'debug' && '--debug' || '' }}
  WEBRTC_REPO_URL: https://github.com/${{ vars.WEBRTC_REPO || 'webrtc-sdk/webrtc' }}.git

# The Linux source cache (.github/actions/source-cache, Namespace volume) is
# shared by the android and libwebrtc_linux jobs and the sync and unittests
# workflows. It is updated only when the webrtc commit changes or
# force_cache_update is checked. Jobs sharing it sync the same target_os
# (--sync-for). GitHub-hosted macOS/Windows jobs sync from scratch.

# Dry run (input dry_run, or repository variable BUILD_DRY_RUN=true, e.g. in a
# test repository): skip every build job and upload placeholder packages with
# the real names and checksums instead.

jobs:
  dry-run:
    if: inputs.dry_run || vars.BUILD_DRY_RUN == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: python3 scripts/build.py fake $CONFIG_ARGS
    - uses: actions/upload-artifact@v4
      with:
        name: packages-dry-run
        path: _package/*

  # GitHub-hosted macOS jobs cannot share a checkout, so each apple variant
  # syncs in its own parallel job: 11 slices per variant on a 3-core runner
  # already take hours, and two in one job risk the 6h job limit.
  build-apple:
    if: ${{ !(inputs.dry_run || vars.BUILD_DRY_RUN == 'true') }}
    name: build (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: apple
            targets: apple
          - id: apple-prefixed
            targets: apple_prefixed
          - id: apple-prefixed-stripped
            targets: apple_prefixed_stripped
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v5
    - name: Select Xcode 26.0
      run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
    - name: Source cache
      id: cache
      uses: ./.github/actions/source-cache
      with:
        backend: none
        commit: ${{ inputs.commitHash }}
    - name: Build
      run: |
        python3 scripts/build.py build ${{ matrix.targets }} --sync-for apple ${{ steps.cache.outputs.history-arg }} \
          --commit '${{ steps.cache.outputs.commit }}' ${{ steps.cache.outputs.fresh-arg }} $CONFIG_ARGS
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.id }}
        path: _package/*
        compression-level: 0

  # Linux: sync the shared checkout once on the Namespace cache volume, then
  # build every target in parallel. Each build job mounts the synced volume,
  # so its own sync is skipped (same commit) and it only compiles its target.
  sync-linux:
    if: ${{ !(inputs.dry_run || vars.BUILD_DRY_RUN == 'true') }}
    name: sync (linux)
    runs-on: namespace-profile-webrtc-android
    outputs:
      commit: ${{ steps.cache.outputs.commit }}
    steps:
    - uses: actions/checkout@v5
    - name: Source cache
      id: cache
      uses: ./.github/actions/source-cache
      with:
        backend: namespace
        id: linux
        commit: ${{ inputs.commitHash }}
        force: ${{ inputs.force_cache_update || 'false' }}
    - name: Sync
      run: |
        python3 scripts/build.py sync android libwebrtc_linux_x64 \
          --commit '${{ steps.cache.outputs.commit }}' ${{ steps.cache.outputs.fresh-arg }}

  build-linux:
    if: ${{ !(inputs.dry_run || vars.BUILD_DRY_RUN == 'true') }}
    name: build (${{ matrix.target }})
    needs: sync-linux
    strategy:
      fail-fast: false
      matrix:
        target:
          - android
          - android_prefixed
          - android_prefixed_stripped
          - libwebrtc_linux_x64
          - libwebrtc_linux_arm64
    runs-on: namespace-profile-webrtc-android
    steps:
    - uses: actions/checkout@v5
    - uses: actions/checkout@v5
      if: startsWith(matrix.target, 'libwebrtc_')
      with:
        repository: webrtc-sdk/libwebrtc
        ref: ${{ inputs.libwebrtcRef || 'main' }}
        path: libwebrtc
    - name: Install dependencies
      run: |
        sudo ./scripts/apt_install_x86_64.sh
        if [[ '${{ matrix.target }}' == libwebrtc_* ]]; then sudo apt-get install -y openjdk-11-jdk; fi
    - name: Source cache
      uses: ./.github/actions/source-cache
      with:
        backend: namespace
        id: linux
    - name: Build
      run: |
        # Same --sync-for as sync-linux: the checkout is already at this
        # commit, so this sync is skipped (or a quick catch-up if the volume
        # did not carry over).
        extra=''
        if [[ '${{ matrix.target }}' == libwebrtc_* ]]; then extra='--libwebrtc-dir libwebrtc'; fi
        python3 scripts/build.py build ${{ matrix.target }} $extra \
          --sync-for android libwebrtc_linux_x64 \
          --commit '${{ needs.sync-linux.outputs.commit }}' $CONFIG_ARGS
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.target }}
        path: _package/*
        compression-level: 0

  build-libwebrtc-windows:
    if: ${{ !(inputs.dry_run || vars.BUILD_DRY_RUN == 'true') }}
    name: build (libwebrtc_win_${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v5
    - uses: actions/checkout@v5
      with:
        repository: webrtc-sdk/libwebrtc
        ref: ${{ inputs.libwebrtcRef || 'main' }}
        path: libwebrtc
    - name: Source cache
      id: cache
      uses: ./.github/actions/source-cache
      with:
        backend: none
        commit: ${{ inputs.commitHash }}
    - name: Build
      # The D:\ work drive is too small for a webrtc checkout; use C:\.
      shell: pwsh
      env:
        COMMIT: ${{ steps.cache.outputs.commit }}
        FRESH: ${{ steps.cache.outputs.fresh-arg }}
        HISTORY: ${{ steps.cache.outputs.history-arg }}
        CONFIGURATION: ${{ inputs.configuration }}
      run: |
        $extra = @('--commit', $env:COMMIT)
        if ($env:FRESH) { $extra += $env:FRESH }
        if ($env:HISTORY) { $extra += $env:HISTORY }
        if ($env:CONFIGURATION -eq 'debug') { $extra += '--debug' }
        python3 scripts/build.py build libwebrtc_win_${{ matrix.arch }} `
          --libwebrtc-dir libwebrtc --work-dir 'C:\wb' --sync-for libwebrtc_win_x64 @extra
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-libwebrtc-win-${{ matrix.arch }}
        path: C:\wb\_package\*
        compression-level: 0
