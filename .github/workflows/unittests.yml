name: WebRTC Unit Tests

on:
  workflow_dispatch:
    inputs:
      commitHash:
        description: 'webrtc-sdk/webrtc commit hash (default: WEBRTC_COMMIT in VERSION)'
        default: ''
        required: false
      force_cache_update:
        description: 'Rebuild the source caches from scratch'
        type: boolean
        default: false
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write  # source-cache deletes an entry before re-saving it

jobs:
  unittests:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each entry syncs with the same targets (--sync-for) as the build
          # jobs sharing its source cache, so the cache content stays identical.
          - target: linux_x86_64
            os: namespace-profile-webrtc-android
            cache_backend: namespace
            cache_id: linux
            sync_for: android libwebrtc_linux_x64
            work_dir: .
          - target: macos_arm64
            os: macos-26
            cache_backend: actions
            cache_id: apple
            sync_for: apple
            work_dir: .
            git_cache: /Users/runner/gclient-cache
          - target: windows_x86_64
            os: windows-2025
            cache_backend: actions
            cache_id: windows
            sync_for: libwebrtc_win_x64
            # The D:\ work drive is too small for a webrtc checkout.
            work_dir: 'C:\webrtc'
            git_cache: 'C:\gclient-cache'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Disk Cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
          foreach ($dir in @('C:\Android', 'C:\Program Files (x86)\Android', 'C:\Program Files\Google\Chrome', "$env:AGENT_TOOLSDIRECTORY\Ruby", "$env:AGENT_TOOLSDIRECTORY\go", "$env:AGENT_TOOLSDIRECTORY\node")) {
            if (Test-Path $dir) {
              Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo ./scripts/apt_install_x86_64.sh
          sudo ./scripts/apt_install_test_deps.sh
      - name: Select Xcode 26.0
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      - name: Source cache
        id: cache
        uses: ./.github/actions/source-cache
        with:
          backend: ${{ matrix.cache_backend }}
          id: ${{ matrix.cache_id }}
          commit: ${{ github.event.inputs.commitHash }}
          force: ${{ github.event.inputs.force_cache_update || 'false' }}
          git-cache-path: ${{ matrix.git_cache }}
      - name: Build and run unittests
        run: |
          python3 scripts/build.py test --sync-for ${{ matrix.sync_for }} \
            ${{ steps.cache.outputs.fresh-arg }} \
            --work-dir '${{ matrix.work_dir }}' --commit '${{ steps.cache.outputs.commit }}'
