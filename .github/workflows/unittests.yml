name: WebRTC Unit Tests

on:
  workflow_dispatch:
    inputs:
      commitHash:
        description: 'webrtc-sdk commit hash'
        default: ''
        required: true
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittests:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-24.04_x86_64
            os: ubuntu-24.04
          - target: macos_arm64
            os: macos-26
          - target: windows_x86_64
            os: windows-2025
    defaults:
      run:
        working-directory: ./build
    steps:
      - uses: actions/checkout@v4
      - name: Disk Cleanup
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          df -h
          docker container prune -f
          docker image prune -a -f
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/dotnet
          df -h
      - name: Disk Cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
          foreach ($dir in @('C:\Android', 'C:\Program Files (x86)\Android', 'C:\Program Files\Google\Chrome', "$env:AGENT_TOOLSDIRECTORY\Ruby", "$env:AGENT_TOOLSDIRECTORY\go", "$env:AGENT_TOOLSDIRECTORY\node")) {
            if (Test-Path $dir) {
              Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo ./scripts/apt_install_x86_64.sh
      - name: Install test dependencies
        if: runner.os == 'Linux'
        run: sudo ./scripts/apt_install_test_deps.sh
      - name: Select Xcode 26.0
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      - name: Build and run unittests
        if: runner.os != 'Windows'
        env:
          COMMIT_HASH: ${{ github.event.inputs.commitHash }}
        run: |
          if [ -n "$COMMIT_HASH" ]; then
            python3 run.py build ${{ matrix.target }} --debug --test --commit "$COMMIT_HASH"
          else
            python3 run.py build ${{ matrix.target }} --debug --test
          fi
      - name: Build and run unittests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COMMIT_HASH: ${{ github.event.inputs.commitHash }}
        run: |
          # GitHub Actions の作業ドライブ (D:) は容量が少ないので、
          # ソースとビルド成果物は C:\ に置く (build.windows_x86_64.ps1 と同じ)。
          # Put the source and build output on C:\ because the D:\ work drive
          # is too small (same as build.windows_x86_64.ps1).
          $extra = @()
          if ($env:COMMIT_HASH) {
            $extra = @('--commit', $env:COMMIT_HASH)
          }
          python3 run.py build ${{ matrix.target }} `
            --source-dir 'C:\webrtc' --build-dir 'C:\webrtc-build' `
            --debug --test `
            --webrtc-extra-gn-args 'symbol_level=1' @extra
