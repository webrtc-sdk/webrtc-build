name: release-pr-refresh

# Keeps open release/* PRs on the newest webrtc commit: bumps WEBRTC_COMMIT in
# VERSION (which re-runs the PR checks) and rewrites the PR body with every
# webrtc commit since the previous release. Add the `pin` label to a PR to
# freeze its commit; the body is still refreshed.
#
# Triggers: a repository_dispatch `webrtc-updated` sent by the webrtc
# repository on push, an hourly fallback, or by hand.

on:
  repository_dispatch:
    types: [webrtc-updated]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr-refresh
  cancel-in-progress: false

env:
  WEBRTC_REPO: ${{ vars.WEBRTC_REPO || 'webrtc-sdk/webrtc' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        # Pushes made with RELEASE_TOKEN trigger the PR build; GITHUB_TOKEN
        # pushes do not.
        token: ${{ secrets.RELEASE_TOKEN || github.token }}
    - name: Refresh release PRs
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898499+github-actions[bot]@users.noreply.github.com'
        HEAD_SHA=$(git ls-remote "https://github.com/$WEBRTC_REPO.git" HEAD | cut -f1)
        echo "webrtc $WEBRTC_REPO HEAD: $HEAD_SHA"
        # Previous release: WEBRTC_COMMIT on the default branch.
        git show "origin/$DEFAULT_BRANCH:VERSION" > "$RUNNER_TEMP/BASE_VERSION"
        BASE=$(python3 scripts/release.py get --key WEBRTC_COMMIT --file "$RUNNER_TEMP/BASE_VERSION")

        gh pr list --state open --json number,headRefName,labels \
          --jq '.[] | select(.headRefName | startswith("release/")) | [.number, .headRefName, ([.labels[].name] | index("pin") != null)] | @tsv' |
        while IFS=$'\t' read -r PR BRANCH PINNED; do
          VERSION="${BRANCH#release/}"
          echo "::group::#$PR $BRANCH (pinned: $PINNED)"
          git checkout -q -B "$BRANCH" "origin/$BRANCH"
          CURRENT=$(python3 scripts/release.py get --key WEBRTC_COMMIT)
          TARGET="$CURRENT"
          if [ "$PINNED" != true ] && [ "$CURRENT" != "$HEAD_SHA" ]; then
            TARGET="$HEAD_SHA"
            python3 scripts/release.py set-version "$VERSION" --commit "$TARGET"
            git commit -qam "Update webrtc to ${TARGET:0:10}"
            git push -q origin "HEAD:$BRANCH"
            echo "bumped $CURRENT -> $TARGET"
            echo "- #$PR: webrtc ${CURRENT:0:10} → ${TARGET:0:10}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- #$PR: unchanged at ${CURRENT:0:10}" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/release.py notes --base "$BASE" --head "$TARGET" --version "$VERSION" --out "$RUNNER_TEMP/notes.md"
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/notes.md"
          echo "::endgroup::"
        done
